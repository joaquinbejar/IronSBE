name: Code Coverage Report

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always
  # GCC on Ubuntu 26 turns a warning in libxdp-sys vendored libbpf into an error
  CFLAGS: "-g -O2 -Wno-error"
  # newer clang warns on "-S ... -c" in libxdp BPF build, which uses -Werror
  BPF_CFLAGS: "-Wno-visibility -fno-stack-protector -Wno-unused-command-line-argument"

jobs:
  code_coverage_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make pkg-config libelf-dev zlib1g-dev libpcap-dev clang llvm m4

      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin --locked --version '>=0.37.5'

      - name: Generate code coverage report
        run:
          cargo tarpaulin
          --all-features
          --workspace
          --exclude ironsbe-transport-dpdk
          --exclude ironsbe-transport-rdma
          --timeout 180
          --out Xml

      - name: Upload coverage reports to Codecov.io
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
